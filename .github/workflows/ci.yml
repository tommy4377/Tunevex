name: CI

on:
  push:
    branches: [main, master, rebuilt-history]
  pull_request:

permissions:
  contents: write

jobs:
  format-once:
    name: Format Rust once
    if: github.event_name == 'pull_request' && github.head_ref == 'rebrand/tunevex'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebrand/tunevex
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt and commit if needed
        run: |
          cd src-tauri
          cargo fmt
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(rust): apply rustfmt"
          git push origin HEAD:rebrand/tunevex

  lockfile-once:
    name: Refresh Cargo.lock once
    if: github.event_name == 'pull_request' && github.head_ref == 'rebrand/tunevex'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebrand/tunevex
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate lockfile and commit if needed
        run: |
          cd src-tauri
          cargo generate-lockfile
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(deps): refresh Cargo.lock"
          git push origin HEAD:rebrand/tunevex

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  rust:
    name: Rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Check
        working-directory: src-tauri
        run: cargo check --locked
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked
