name: Format Rust once

on:
  push:
    branches:
      - rebrand/tunevex
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebrand/tunevex
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        working-directory: src-tauri
        run: cargo fmt
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(rust): apply rustfmt"
          git push origin HEAD:rebrand/tunevex
