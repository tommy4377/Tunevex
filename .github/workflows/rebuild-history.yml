name: Rebuild history once

on:
  push:
    branches:
      - rebrand/tunevex
    paths:
      - .github/workflows/rebuild-history.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebrand/tunevex
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Build clean orphan history
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import shutil
          import subprocess
          import tarfile
          import tempfile
          from pathlib import Path

          ROOT = Path.cwd()
          AUTHOR_NAME = "Tommaso Verardi"
          AUTHOR_EMAIL = "129632197+tommy4377@users.noreply.github.com"

          milestones = [
              ("0.1.0", "8c2c458c5df735003548148664301dfc4f94ee8d", "2026-01-12T10:57:40Z", "feat(core): establish Tunevex Windows tuning engine", "Core tuning engine", [
                  "Initial Rust and Tauri Windows tuning engine",
                  "CPU, network, privacy, security, gaming, storage and input modules",
                  "Stateful apply and undo operations",
                  "Svelte desktop interface",
              ]),
              ("0.2.0", "83642ffce1f9f59e64db5004281b1720d6dcd6ba", "2026-01-21T12:19:10Z", "feat(ui): complete shared UI and Windows 11 shell", "Shared UI and Windows 11 shell", [
                  "Reusable dashboard and control components",
                  "Windows 11 style shell and Mica treatment",
                  "Cleaner system monitoring and quick actions",
                  "Removal of abandoned shell experiments",
              ]),
              ("0.3.0", "324e5566db65f913083e43cc147a3210bd43a30f", "2026-04-09T00:15:41Z", "refactor(core): migrate operations toward native Windows APIs", "Native Windows backend", [
                  "More native registry, service and Windows API operations",
                  "Stronger state detection and rollback semantics",
                  "Safer device and system monitoring",
                  "Large duplicate and bug cleanup",
              ]),
              ("0.4.0", "197a8d88bb46822d45203c2e6475b1fdd51115aa", "2026-04-11T22:03:59Z", "feat(ai): add Gemini advisor and persistent context", "AI Advisor", [
                  "Optional Gemini powered advisor",
                  "Analyze, chat and diagnose workflows",
                  "Windows Credential Manager key storage",
                  "System profile aware recommendations",
              ]),
              ("0.5.0", "d9369d029a1bb7da1a716e7fef2c85890e880d7e", "2026-04-12T00:18:39Z", "feat(startup): add safety-aware startup analysis", "Startup analyzer", [
                  "Startup scanning across common Windows autostart locations",
                  "Safety classification and critical entry protection",
                  "AI assisted startup recommendations",
                  "Detailed startup scan reports",
              ]),
              ("0.6.0", "382f31a3d5d017b54714b159345a7ab70d9c2869", "2026-09-05T21:02:01Z", "feat(profiles): add portable profiles and reliable rollback", "Profiles and rollback reliability", [
                  "Portable JSON tweak profiles",
                  "Import preview and validation",
                  "More accurate live state detection",
                  "Improved backup and rollback behavior",
              ]),
              ("1.0.0", "FINAL", "2026-09-21T13:00:00Z", "release: launch Tunevex 1.0.0", "Tunevex 1.0", [
                  "Complete Tunevex product and executable branding",
                  "Compatibility with legacy TommyTweaker data, profiles and credentials",
                  "Repository governance, CI and dependency automation",
                  "Portable-only Windows release pipeline",
              ]),
          ]

          def run(args, cwd=None, env=None, check=True):
              result = subprocess.run(args, cwd=cwd or ROOT, env=env, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              if check and result.returncode != 0:
                  print(result.stdout)
                  raise SystemExit(result.returncode)
              return result

          def copy_file(src, dst):
              src, dst = Path(src), Path(dst)
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          def extract(ref, dest):
              dest.mkdir(parents=True, exist_ok=True)
              archive = dest.parent / (ref[:12] + ".tar")
              run(["git", "archive", "--format=tar", "-o", str(archive), ref])
              with tarfile.open(archive, "r") as tf:
                  tf.extractall(dest)
              archive.unlink()

          def remove_path(path):
              path = Path(path)
              if path.is_dir():
                  shutil.rmtree(path, ignore_errors=True)
              elif path.exists():
                  path.unlink()

          def sanitize(stage, final=False):
              drop_dirs = [
                  ".opencode", ".vscode", ".serena", ".claude", ".cursor", ".windsurf",
                  "tweak", "optimizer-master", "SecureUxTheme-master", "TommyTweaker-master", "winutil-main"
              ]
              for name in drop_dirs:
                  for p in list(stage.rglob(name)):
                      if p.is_dir():
                          shutil.rmtree(p, ignore_errors=True)

              exact = [
                  "AGENTS.MD", "STATUS.MD", "BUGFIX_CHECKLIST.md",
                  "# TommyTweaker — Bug Fix Checklist.md", "problems.md", "ai_advisor.md",
                  "tommy-tweaker-memory.json", "all_tweaks_audit.txt", "audit_tweaks.txt",
                  "implementation_plan.md", "prompt.md", "promptEAnalisi.txt",
                  "src-tauri/build_log.txt", "src-tauri/output.txt", "src-tauri/verify_display_log.txt",
                  "TWEAK_ENGINE_FIXES.md"
              ]
              for rel in exact:
                  remove_path(stage / rel)

              for p in list(stage.glob("FINAL_CORRECTED_ROADMAP*")) + list(stage.glob("IMPLEMENTATION_*")) + list(stage.glob("MASTER_IMPLEMENTATION_*")) + list(stage.glob("QA_AUDIT_REPORT*")):
                  remove_path(p)

              if (stage / "src-tauri").exists():
                  for p in list((stage / "src-tauri").glob("verify_*.ps1")):
                      remove_path(p)

              for p in list(stage.rglob("*")):
                  if p.is_file() and re.match(r"(?i)^screenshot.*\.(png|jpg|jpeg|webp)$", p.name):
                      p.unlink()

              for rel in [
                  "src-tauri/resources/startallback",
                  "src-tauri/resources/secureuxtheme",
                  "src-tauri/public/startallback files",
              ]:
                  remove_path(stage / rel)

              remove_path(stage / ".github")
              if not final:
                  for p in list(stage.glob("*.md")) + list(stage.glob("*.MD")):
                      if p.name.lower() != "readme.md":
                          remove_path(p)

          def rename_paths(stage):
              for p in sorted(stage.rglob("*"), key=lambda x: len(x.parts), reverse=True):
                  new_name = p.name
                  for old, new in [
                      ("TommyTweaker", "Tunevex"),
                      ("tommytweaker", "tunevex"),
                      ("TOMMYTWEAKER", "TUNEVEX"),
                      ("tommy-tweaker", "tunevex"),
                  ]:
                      new_name = new_name.replace(old, new)
                  if new_name != p.name:
                      target = p.with_name(new_name)
                      if not target.exists():
                          p.rename(target)

          def rebrand_text(stage):
              replacements = [
                  ("Tommy Tweaker", "Tunevex"),
                  ("TommyTweaker", "Tunevex"),
                  ("TOMMYTWEAKER", "TUNEVEX"),
                  ("tommytweaker", "tunevex"),
                  ("tommy_tweaker", "tunevex"),
                  ("tommy-tweaker", "tunevex"),
              ]
              suffixes = {".rs", ".toml", ".lock", ".json", ".js", ".ts", ".svelte", ".md", ".yml", ".yaml", ".html", ".css", ".ps1", ".bat", ".txt", ".xml"}
              for p in stage.rglob("*"):
                  if not p.is_file() or not (p.name == ".gitignore" or p.suffix.lower() in suffixes):
                      continue
                  try:
                      text = p.read_text(encoding="utf-8")
                  except Exception:
                      continue
                  for old, new in replacements:
                      text = text.replace(old, new)
                  p.write_text(text, encoding="utf-8")

          def strip_mcp(stage):
              cargo = stage / "src-tauri/Cargo.toml"
              if cargo.exists():
                  text = cargo.read_text(encoding="utf-8")
                  text = re.sub(r'(?m)^tauri-plugin-mcp-bridge\s*=\s*"[^"]+"\s*\n?', "", text)
                  cargo.write_text(text, encoding="utf-8")

              lib = stage / "src-tauri/src/lib.rs"
              if lib.exists():
                  text = lib.read_text(encoding="utf-8")
                  text = re.sub(
                      r'\n\s*#\[cfg\(debug_assertions\)\]\s*\n\s*let builder\s*=\s*builder\.plugin\([\s\S]*?tauri_plugin_mcp_bridge[\s\S]*?\n\s*\);\s*\n',
                      "\n",
                      text,
                      count=1,
                  )
                  lib.write_text(text, encoding="utf-8")

          def set_version(stage, version):
              package = stage / "package.json"
              if package.exists():
                  data = json.loads(package.read_text(encoding="utf-8"))
                  data["name"] = "tunevex"
                  data["version"] = version
                  data["description"] = "Tunevex - Windows system tuning and optimization utility"
                  data["license"] = "MIT"
                  package.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

              lock = stage / "package-lock.json"
              if lock.exists():
                  data = json.loads(lock.read_text(encoding="utf-8"))
                  data["name"] = "tunevex"
                  data["version"] = version
                  if isinstance(data.get("packages"), dict) and isinstance(data["packages"].get(""), dict):
                      data["packages"][""]["name"] = "tunevex"
                      data["packages"][""]["version"] = version
                  lock.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

              cargo = stage / "src-tauri/Cargo.toml"
              if cargo.exists():
                  text = cargo.read_text(encoding="utf-8")
                  text = re.sub(r'(?ms)(\[package\].*?^name\s*=\s*")[^"]+(")', r'\1tunevex\2', text, count=1)
                  text = re.sub(r'(?ms)(\[package\].*?^version\s*=\s*")[^"]+(")', r'\g<1>' + version + r'\2', text, count=1)
                  text = re.sub(r'(?m)^authors\s*=\s*\[[^\]]*\]', 'authors = ["Tommaso Verardi"]', text, count=1)
                  if "description =" in text.split("[dependencies]", 1)[0]:
                      text = re.sub(r'(?m)^description\s*=\s*"[^"]*"', 'description = "Windows system tuning and optimization utility"', text, count=1)
                  else:
                      text = text.replace('edition = "2021"', 'edition = "2021"\ndescription = "Windows system tuning and optimization utility"', 1)
                  package_section = text.split("[dependencies]", 1)[0]
                  if "license =" not in package_section:
                      text = text.replace('edition = "2021"', 'edition = "2021"\nlicense = "MIT"\npublish = false', 1)
                  cargo.write_text(text, encoding="utf-8")

              tauri = stage / "src-tauri/tauri.conf.json"
              if tauri.exists():
                  data = json.loads(tauri.read_text(encoding="utf-8"))
                  data["productName"] = "Tunevex"
                  data["version"] = version
                  data["identifier"] = "com.tommy4377.tunevex"
                  windows = data.get("app", {}).get("windows", [])
                  if windows:
                      windows[0]["title"] = "Tunevex"
                  tauri.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          def write_readme(stage, version, title, features):
              for p in [stage / "README.md", stage / "README.MD"]:
                  remove_path(p)
              bullets = "\n".join("- " + item for item in features)
              text = (
                  "# Tunevex v" + version + "\n\n"
                  + title + "\n\n"
                  + "Tunevex is a Windows system tuning and optimization utility built with Rust, Tauri and Svelte.\n\n"
                  + "## Highlights\n\n" + bullets + "\n\n"
                  + "## Safety\n\n"
                  + "Tunevex changes Windows system settings. Create a restore point before applying groups of tweaks and review higher-risk controls individually.\n\n"
                  + "## Development\n\n"
                  + "Run npm ci, npm run check and npm run tauri dev from the repository root.\n\n"
                  + "## Release\n\n"
                  + "Release tags publish one portable Windows executable named Tunevex.exe.\n\n"
                  + "## License\n\n"
                  + "MIT License. Copyright 2026 Tommaso Verardi.\n"
              )
              (stage / "README.md").write_text(text, encoding="utf-8")

          def copy_metadata(stage, meta, final):
              for rel in ["LICENSE", ".gitignore", "src-tauri/.gitignore"]:
                  src = meta / rel
                  if src.exists():
                      copy_file(src, stage / rel)

              workflow_dir = stage / ".github/workflows"
              workflow_dir.mkdir(parents=True, exist_ok=True)
              for rel in [".github/workflows/ci.yml", ".github/workflows/release.yml"]:
                  copy_file(meta / rel, stage / rel)

              if final:
                  for rel in [
                      "CONTRIBUTING.md", "SECURITY.md", "SUPPORT.md", "CODE_OF_CONDUCT.md", "NOTICE.md",
                      ".github/CODEOWNERS", ".github/dependabot.yml", ".github/pull_request_template.md",
                      ".github/ISSUE_TEMPLATE/bug_report.yml", ".github/ISSUE_TEMPLATE/feature_request.yml",
                      ".github/ISSUE_TEMPLATE/config.yml",
                  ]:
                      src = meta / rel
                      if src.exists():
                          copy_file(src, stage / rel)

          def prepare(ref, version, title, features, meta, temp_root, final=False):
              stage = temp_root / ("stage-" + version)
              extract(ref, stage)
              sanitize(stage, final=final)
              if not final:
                  rename_paths(stage)
                  rebrand_text(stage)
                  strip_mcp(stage)
                  set_version(stage, version)
                  write_readme(stage, version, title, features)
                  if version == "0.1.0":
                      lib = stage / "src-tauri/src/lib.rs"
                      if lib.exists():
                          text = lib.read_text(encoding="utf-8")
                          text = text.replace("use crate::modules::hardware::get_hardware_tweaks;\n", "")
                          text = text.replace("    all_tweaks.extend(get_hardware_tweaks());\n", "")
                          lib.write_text(text, encoding="utf-8")
                  if version == "0.2.0":
                      for rel in [
                          "src/components/ui/Card.svelte",
                          "src/components/ui/SectionHeader.svelte",
                          "src/components/ui/Select.svelte",
                      ]:
                          content = run(["git", "show", "324e5566db65f913083e43cc147a3210bd43a30f:" + rel]).stdout
                          target = stage / rel
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_text(content, encoding="utf-8")
              copy_metadata(stage, meta, final=final)

              cargo = stage / "src-tauri/Cargo.toml"
              if cargo.exists():
                  run(["cargo", "generate-lockfile", "--manifest-path", str(cargo)], cwd=stage, check=False)
                  run(["cargo", "fmt", "--manifest-path", str(cargo)], cwd=stage, check=False)
              return stage

          final_ref = run(["git", "rev-parse", "HEAD"]).stdout.strip()
          temp_root = Path(tempfile.mkdtemp(prefix="tunevex-history-"))
          meta = temp_root / "meta"
          meta.mkdir(parents=True)

          meta_files = [
              "README.md", "LICENSE", ".gitignore", "src-tauri/.gitignore",
              "CONTRIBUTING.md", "SECURITY.md", "SUPPORT.md", "CODE_OF_CONDUCT.md", "NOTICE.md",
              ".github/CODEOWNERS", ".github/dependabot.yml", ".github/pull_request_template.md",
              ".github/ISSUE_TEMPLATE/bug_report.yml", ".github/ISSUE_TEMPLATE/feature_request.yml",
              ".github/ISSUE_TEMPLATE/config.yml", ".github/workflows/ci.yml", ".github/workflows/release.yml",
          ]
          for rel in meta_files:
              src = ROOT / rel
              if src.exists():
                  copy_file(src, meta / rel)

          prepared = []
          for version, ref, date, message, title, features in milestones:
              actual_ref = final_ref if ref == "FINAL" else ref
              prepared.append((version, date, message, prepare(actual_ref, version, title, features, meta, temp_root, final=(version == "1.0.0"))))

          run(["git", "config", "user.name", AUTHOR_NAME])
          run(["git", "config", "user.email", AUTHOR_EMAIL])
          run(["git", "switch", "--orphan", "rebuilt-history"])

          def clear_root():
              for child in ROOT.iterdir():
                  if child.name == ".git":
                      continue
                  remove_path(child)

          clear_root()
          built = []

          for version, date, message, stage in prepared:
              clear_root()
              for child in stage.iterdir():
                  dst = ROOT / child.name
                  if child.is_dir():
                      shutil.copytree(child, dst)
                  else:
                      shutil.copy2(child, dst)

              run(["git", "add", "-A"])
              env = os.environ.copy()
              env["GIT_AUTHOR_NAME"] = AUTHOR_NAME
              env["GIT_AUTHOR_EMAIL"] = AUTHOR_EMAIL
              env["GIT_COMMITTER_NAME"] = AUTHOR_NAME
              env["GIT_COMMITTER_EMAIL"] = AUTHOR_EMAIL
              env["GIT_AUTHOR_DATE"] = date
              env["GIT_COMMITTER_DATE"] = date
              run(["git", "commit", "-m", message], env=env)
              sha = run(["git", "rev-parse", "HEAD"]).stdout.strip()
              built.append((version, sha))
              print("BUILT v" + version + " " + sha)

          run(["git", "push", "--force", "origin", "HEAD:refs/heads/rebuilt-history"])
          print("REBUILT_HISTORY_HEAD=" + run(["git", "rev-parse", "HEAD"]).stdout.strip())
          for version, sha in built:
              print("MILESTONE v" + version + "=" + sha)
          PY
