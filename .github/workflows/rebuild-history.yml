name: Rebuild curated history
# rebuild revision 2

on:
  push:
    branches:
      - rebrand/tunevex
    paths:
      - .github/workflows/rebuild-history.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: rebrand/tunevex

      - uses: dtolnay/rust-toolchain@stable

      - name: Build clean milestone history
        run: python .github/rebuild_history.py
