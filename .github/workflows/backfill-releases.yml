name: Validate curated snapshots

on:
  push:
    branches:
      - rebrand/tunevex
    paths:
      - .github/workflows/backfill-releases.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.tag }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: v0.1.0
            ref: dbe820a84c55588a6c178e5a4de6dac98df2b287
          - tag: v0.2.0
            ref: 02e7456386934d047f02fb5d72c3f3f2421a4154
          - tag: v0.3.0
            ref: c273bd6456a2e6a39451f8b050204b2c1bcfb2fc
          - tag: v0.4.0
            ref: 2d7eabae742088469b28d8174fef9068edb1e018
          - tag: v0.5.0
            ref: f64479847951a8e2df15aeebae03552be598b354
          - tag: v0.6.0
            ref: f2b8d6a031a9bcc55ab8312b2f3a8bb8abbcdec6
          - tag: v1.0.0
            ref: 996a12e57635874ba225a7cb3592597ebb1be9be

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: validate-${{ matrix.tag }}

      - run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Rust check
        working-directory: src-tauri
        run: cargo check --locked
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - name: Build portable executable
        run: npm run tauri build -- --no-bundle
      - name: Confirm portable executable
        shell: pwsh
        run: |
          if (!(Test-Path "src-tauri/target/release/tunevex.exe")) {
            throw "Tunevex portable executable was not produced"
          }
