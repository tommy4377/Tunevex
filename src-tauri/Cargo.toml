[package]
name = "tunevex"
version = "3.0.0"
description = "Windows system tuning and optimization utility"
authors = ["Tommaso Verardi"]
edition = "2021"
license = "MIT"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tunevex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.9.1", features = [] }
tauri-plugin-opener = "2.5.3"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-mcp-bridge = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
hickory-resolver = "0.24"
rayon = "1.10"
rust-embed = "8.5.0"


rdev = "0.5"
walkdir = "2.4"
globset = "0.4"
tokio = { version = "1", features = ["full"] }
pelite = "0.10"
sysinfo = "0.37"
strip-ansi-escapes = "0.2"

# AI Dependencies
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native"] }

# HTTP plugin for Tauri

# Windows Dependencies (Now Mandatory)
winreg = "0.52"
window-vibrancy = "0.5"
vite = "0.1.0"
# wmi removed: unused dep that conflicts with windows = "0.61" (windows_core version mismatch)

[dependencies.windows]
version = "0.61.3"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Devices_Display",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Performance",
]

[profile.release]
codegen-units = 1 # Maximum optimization, slower compile
lto = true        # Link-Time Optimization
opt-level = "s"   # Optimize for size (very close to '3' in speed, much smaller)
panic = "abort"   # Remove stack unwinding for smaller binary
strip = true      # Strip symbols
